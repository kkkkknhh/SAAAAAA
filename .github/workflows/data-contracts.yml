name: data-contracts

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, develop, "copilot/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml
          python -m pip install -e .

      - name: Validate execution_mapping.yaml
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
          python tools/validate_execution_mapping.py || echo "⚠️  Execution mapping validation failed (non-blocking)"

      - name: Schema validation
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
          python schema_validator.py || echo "⚠️  Schema validation failed (non-blocking)"

      - name: Cross reference integrity
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
          python tools/integrity/check_cross_refs.py || echo "⚠️  Cross reference check failed (non-blocking)"

      - name: Questionnaire lint
        run: |
          if [ -f "questionnaire.json" ] && [ -f "schemas/questionnaire.schema.json" ]; then
            python tools/lint/json_lint.py questionnaire.json --schema schemas/questionnaire.schema.json || echo "⚠️  Questionnaire lint failed"
          else
            echo "⚠️  Skipping: questionnaire.json or schema not found"
          fi

      - name: Rubric lint
        run: |
          if [ -f "rubric_scoring.json" ] && [ -f "schemas/rubric_scoring.schema.json" ]; then
            python tools/lint/json_lint.py rubric_scoring.json --schema schemas/rubric_scoring.schema.json || echo "⚠️  Rubric lint failed"
          else
            echo "⚠️  Skipping: rubric_scoring.json or schema not found"
          fi
      
      - name: Scoring parity validation
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
          python tools/validation/validate_scoring_parity.py || echo "⚠️  Scoring parity validation failed (non-blocking)"

      - name: Deterministic artifact generation
        run: |
          mkdir -p artifacts/run1 artifacts/run2
          python tools/integrity/dump_artifacts.py artifacts/run1 || echo "⚠️  Run1 artifact generation failed"
          python tools/integrity/dump_artifacts.py artifacts/run2 || echo "⚠️  Run2 artifact generation failed"
          if [ -f "artifacts/run1/deterministic_snapshot.json" ] && [ -f "artifacts/run2/deterministic_snapshot.json" ]; then
            sha256sum artifacts/run1/deterministic_snapshot.json artifacts/run2/deterministic_snapshot.json
            diff artifacts/run1/deterministic_snapshot.json artifacts/run2/deterministic_snapshot.json || echo "⚠️  Artifacts differ"
          else
            echo "⚠️  Skipping: snapshot files not generated"
          fi
