name: Secret Scanning

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  secret-scan:
    name: Scan for Secrets and Credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning
      
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      
      - name: Scan for hardcoded credentials in shell scripts
        run: |
          echo "=== Scanning shell scripts for hardcoded credentials ==="
          
          # Check for common patterns in shell scripts
          FINDINGS=0
          
          # Pattern 1: Hardcoded secrets like "dev-secret-key"
          if grep -r "dev-secret" --include="*.sh" . 2>/dev/null; then
            echo "⚠️  Found potential hardcoded dev secrets"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # Pattern 2: Insecure password patterns
          if grep -rE "(password|secret|key)=['\"]?[a-zA-Z0-9]{8,}" --include="*.sh" . 2>/dev/null | grep -v "YOUR_"; then
            echo "⚠️  Found potential hardcoded passwords"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # Pattern 3: AWS keys
          if grep -rE "AKIA[0-9A-Z]{16}" . 2>/dev/null; then
            echo "❌ ERROR: Found AWS access key!"
            exit 1
          fi
          
          # Pattern 4: Private keys
          if grep -r "BEGIN.*PRIVATE KEY" --include="*.py" --include="*.sh" --include="*.yaml" --include="*.yml" . 2>/dev/null; then
            echo "❌ ERROR: Found private key!"
            exit 1
          fi
          
          if [ $FINDINGS -gt 0 ]; then
            echo "⚠️  Total findings: $FINDINGS (review required)"
          else
            echo "✅ No obvious hardcoded credentials found"
          fi
      
      - name: Check for exposed tokens in config files
        run: |
          echo "=== Checking configuration files ==="
          
          # Check .env.example for non-placeholder values
          if [ -f ".env.example" ]; then
            if grep -E "^[A-Z_]+=.{20,}" .env.example | grep -vE "(YOUR_|CHANGE_|EXAMPLE_|TODO_|<|>)"; then
              echo "⚠️  Warning: .env.example may contain real values"
            else
              echo "✅ .env.example looks good"
            fi
          fi
          
          # Ensure .env is gitignored
          if [ -f ".gitignore" ]; then
            if grep -q "^\.env$" .gitignore; then
              echo "✅ .env is properly gitignored"
            else
              echo "❌ ERROR: .env should be in .gitignore"
              exit 1
            fi
          fi
      
      - name: Generate security report
        if: always()
        run: |
          echo "# Secret Scanning Report" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Summary" >> security-report.md
          echo "- Secret scanning completed" >> security-report.md
          echo "- Credential patterns checked" >> security-report.md
          echo "- Configuration files validated" >> security-report.md
          
          cat security-report.md
      
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scanning-report
          path: security-report.md
          retention-days: 90
