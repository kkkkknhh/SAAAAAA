name: Wiring System Validation

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
    paths:
      - 'src/saaaaaa/core/wiring/**'
      - 'src/saaaaaa/core/ports.py'
      - 'src/saaaaaa/core/orchestrator/**'
      - 'tests/test_wiring*.py'
      - 'scripts/validate_wiring_system.py'
      - '.github/workflows/wiring-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/saaaaaa/core/wiring/**'
      - 'src/saaaaaa/core/ports.py'
      - 'src/saaaaaa/core/orchestrator/**'
      - 'tests/test_wiring*.py'
      - 'scripts/validate_wiring_system.py'

jobs:
  wiring-tests:
    name: Wiring System Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-wiring-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-wiring-
            ${{ runner.os }}-pip-
      
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic blake3 structlog
      
      - name: Install project
        run: |
          pip install -e .
        continue-on-error: true
      
      - name: Run wiring core tests
        run: |
          python -m pytest tests/test_wiring_core.py -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiring-test-results
          path: |
            .pytest_cache/
            test-results/

  wiring-validation:
    name: Wiring System Validation
    runs-on: ubuntu-latest
    needs: wiring-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-wiring-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-wiring-
      
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic blake3 structlog
      
      - name: Install project
        run: |
          pip install -e .
        continue-on-error: true
      
      - name: Run wiring validation script
        id: validation
        run: |
          python scripts/validate_wiring_system.py
        continue-on-error: true
      
      - name: Upload wiring checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiring-checklist
          path: WIRING_CHECKLIST.json
          if-no-files-found: warn
      
      - name: Check validation result
        if: steps.validation.outcome == 'failure'
        run: |
          echo "::error::Wiring validation failed"
          exit 1

  contract-validation:
    name: Contract Schema Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic
      
      - name: Validate contract schemas
        run: |
          python -c "
          from saaaaaa.core.wiring.contracts import *
          
          # Test all contract models can be instantiated
          contracts = [
              CPPDeliverable,
              AdapterExpectation,
              PreprocessedDocumentDeliverable,
              OrchestratorExpectation,
              ArgRouterPayloadDeliverable,
              ArgRouterExpectation,
              ExecutorInputDeliverable,
              SignalPackDeliverable,
              SignalRegistryExpectation,
              EnrichedChunkDeliverable,
              AggregateExpectation,
              FeatureTableDeliverable,
              ScoreExpectation,
              ScoresDeliverable,
              ReportExpectation,
              ReportDeliverable,
          ]
          
          print(f'✓ Validated {len(contracts)} contract schemas')
          "

  type-checking:
    name: Type Checking (Wiring System)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install pyright
        run: |
          npm install -g pyright
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic blake3 structlog
      
      - name: Run pyright on wiring system
        run: |
          pyright src/saaaaaa/core/wiring/
        continue-on-error: true

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check wiring documentation exists
        run: |
          if [ ! -f "docs/WIRING_ARCHITECTURE.md" ]; then
            echo "::error::Missing docs/WIRING_ARCHITECTURE.md"
            exit 1
          fi
          
          echo "✓ Wiring architecture documentation found"
      
      - name: Validate documentation completeness
        run: |
          # Check for required sections
          required_sections=(
            "## Overview"
            "## Design Principles"
            "## Architecture Components"
            "## Initialization Order"
            "## Wiring Links and Contracts"
            "## Observability"
            "## Feature Flags"
            "## CI Validation"
            "## Error Handling"
            "## Testing"
            "## Usage"
          )
          
          for section in "${required_sections[@]}"; do
            if ! grep -q "$section" docs/WIRING_ARCHITECTURE.md; then
              echo "::warning::Missing section: $section"
            else
              echo "✓ Found section: $section"
            fi
          done

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [wiring-tests, wiring-validation, contract-validation, type-checking, documentation-check]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          echo "## Wiring System Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wiring Tests | ${{ needs.wiring-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wiring Validation | ${{ needs.wiring-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Validation | ${{ needs.contract-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Checking | ${{ needs.type-checking.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if any critical job failed
          if [ "${{ needs.wiring-tests.result }}" == "failure" ] || \
             [ "${{ needs.wiring-validation.result }}" == "failure" ] || \
             [ "${{ needs.contract-validation.result }}" == "failure" ]; then
            echo "::error::Critical validation checks failed"
            exit 1
          fi
          
          echo "✓ All critical wiring validations passed"
