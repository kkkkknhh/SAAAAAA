name: Static Analysis

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main, develop, "copilot/**" ]

jobs:
  type-checking:
    name: Pyright and Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy
        npm install -g pyright
        # Install minimal runtime dependencies for type checking
        pip install -r requirements.txt
        pip install -e .

    - name: Run pyright (strict)
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
        pyright --project pyproject.toml || echo "⚠️  Pyright found issues (non-blocking during transition)"

    - name: Run mypy
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}/src:$PYTHONPATH"
        mypy --config-file pyproject.toml src/saaaaaa || echo "⚠️  Mypy found issues (non-blocking during transition)"
