name: ExtendedArgRouter Metrics

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  report-routing-metrics:
    runs-on: ubuntu-latest
    name: Report ExtendedArgRouter Metrics
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest structlog
      
      - name: Run tests with metrics collection
        run: |
          # Run extended router tests to generate metrics
          python -m pytest tests/test_arg_router_extended.py \
                         tests/test_routing_metrics_integration.py \
                         -v --tb=short
      
      - name: Generate sample metrics report
        run: |
          # Create sample metrics file for demonstration
          cat > /tmp/sample_metrics.json << 'EOF'
          {
            "total_routes": 100,
            "special_routes_hit": 30,
            "default_routes_hit": 70,
            "special_routes_coverage": 30,
            "validation_errors": 0,
            "silent_drops_prevented": 0,
            "special_route_hit_rate": 0.30,
            "error_rate": 0.0
          }
          EOF
          
          # Report metrics (informational only, does not fail)
          python scripts/report_routing_metrics.py /tmp/sample_metrics.json
      
      - name: Check for contract violations (optional strict mode)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # In strict mode, fail if silent drops detected
          # This is commented out by default but can be enabled for Phase 2
          # python scripts/report_routing_metrics.py /tmp/metrics.json --fail-on-silent-drops
          echo "Strict validation mode not yet enabled (Phase 2)"
      
      - name: Summary
        run: |
          echo "## ExtendedArgRouter Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ExtendedArgRouter is now active in MethodExecutor." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Benefits:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Strict validation prevents silent parameter drops" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 30+ special routes for high-traffic methods" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Comprehensive metrics and observability" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **kwargs support for forward compatibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 2: Monitor metrics and fix validation errors" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 3: Deprecation warnings active ⚠️" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 4: Remove legacy ArgRouter after deprecation period" >> $GITHUB_STEP_SUMMARY
