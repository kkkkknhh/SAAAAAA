name: Dependency Gates
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'constraints*.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'src/**/*.py'
      - 'scripts/audit_dependencies.py'
      - 'scripts/verify_importability.py'
      - 'scripts/compare_freeze_lock.py'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit & Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-core.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-core.txt
      
      - name: Gate 1 - Check for Missing Imports
        run: |
          echo "=== Gate 1: Missing Import Detection ==="
          python3 scripts/audit_dependencies.py
          if [ $? -ne 0 ]; then
            echo "❌ FAILED: Missing dependencies detected!"
            echo "Run 'python3 scripts/audit_dependencies.py' locally to identify missing packages"
            exit 1
          fi
          echo "✅ PASSED: No missing dependencies"
      
      - name: Gate 2 - Verify Importability
        run: |
          echo "=== Gate 2: Importability Verification ==="
          python3 scripts/verify_importability.py
          if [ $? -ne 0 ]; then
            echo "❌ FAILED: Some critical packages cannot be imported!"
            echo "Check the output above for details"
            exit 1
          fi
          echo "✅ PASSED: All critical packages importable"
      
      - name: Gate 3 - Check for Open Ranges in Core
        run: |
          echo "=== Gate 3: Open Range Detection ==="
          if grep -E ">=|~=|\*" requirements-core.txt; then
            echo "❌ FAILED: Open version ranges detected in core dependencies!"
            echo "Core dependencies MUST use exact pins (==) for reproducibility"
            echo "Found open ranges (>=, ~=, *) above"
            exit 1
          fi
          echo "✅ PASSED: All core dependencies use exact pins"
      
      - name: Gate 4 - Freeze vs Lock Comparison
        run: |
          echo "=== Gate 4: Freeze vs Lock Comparison ==="
          pip freeze > freeze-ci.txt
          python3 scripts/compare_freeze_lock.py freeze-ci.txt constraints-new.txt || {
            echo "⚠️  WARNING: Installed packages differ from lock file"
            echo "This may be expected if dependencies are being updated"
            echo "Review the differences above"
          }
      
      - name: Gate 5 - Security Vulnerability Scan
        run: |
          echo "=== Gate 5: Security Vulnerability Scan ==="
          pip install pip-audit
          pip-audit --desc || {
            echo "⚠️  WARNING: Security vulnerabilities detected"
            echo "Review vulnerabilities above and update packages if necessary"
            exit 0  # Don't fail build, just warn
          }
          echo "✅ PASSED: No known vulnerabilities"
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report-py${{ matrix.python-version }}
          path: |
            dependency_audit_report.json
            freeze-ci.txt
          retention-days: 30
  
  check-dependency-documentation:
    name: Check Dependency Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check DEPENDENCIES_AUDIT.md exists
        run: |
          if [ ! -f "DEPENDENCIES_AUDIT.md" ]; then
            echo "❌ FAILED: DEPENDENCIES_AUDIT.md not found!"
            echo "This file is required to document all dependencies"
            exit 1
          fi
          echo "✅ PASSED: DEPENDENCIES_AUDIT.md exists"
      
      - name: Check documentation is up-to-date
        run: |
          echo "Checking if dependency documentation mentions recent changes..."
          # Check if the file has been updated recently (within last 90 days)
          last_modified=$(git log -1 --format="%at" DEPENDENCIES_AUDIT.md 2>/dev/null || echo "0")
          current_time=$(date +%s)
          days_old=$(( (current_time - last_modified) / 86400 ))
          
          if [ $days_old -gt 90 ]; then
            echo "⚠️  WARNING: DEPENDENCIES_AUDIT.md was last updated $days_old days ago"
            echo "Consider reviewing and updating the documentation"
          else
            echo "✅ Documentation is recent (last updated $days_old days ago)"
          fi
  
  validate-requirement-files:
    name: Validate Requirement File Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check required files exist
        run: |
          echo "Checking for required dependency files..."
          required_files=(
            "requirements-core.txt"
            "requirements-optional.txt"
            "requirements-dev.txt"
            "requirements-docs.txt"
            "constraints-new.txt"
          )
          
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ FAILED: Missing required files:"
            printf '  - %s\n' "${missing_files[@]}"
            exit 1
          fi
          echo "✅ PASSED: All required files exist"
      
      - name: Validate file format
        run: |
          echo "Validating requirement file format..."
          # Check that files don't have syntax errors
          for file in requirements-*.txt constraints-new.txt; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # Basic validation: no empty package names, proper format
              if grep -E "^==" "$file"; then
                echo "❌ FAILED: $file has malformed lines (starts with ==)"
                exit 1
              fi
            fi
          done
          echo "✅ PASSED: File format valid"
