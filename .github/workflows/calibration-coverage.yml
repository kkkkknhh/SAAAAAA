name: SIN_CARRETA Calibration Coverage Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  calibration-coverage:
    runs-on: ubuntu-latest
    name: Enforce 25% Calibration Coverage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what's needed for the validator
          if [ -f requirements-core.txt ]; then pip install -r requirements-core.txt; fi
      
      - name: Run Calibration Coverage Validator
        run: |
          python scripts/validate_calibration_coverage.py 25.0
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Validate Coverage Report Exists
        if: always()
        run: |
          echo "Calibration coverage validation completed"
          echo "See job output for detailed coverage report"
      
      - name: Fail on Coverage Violation
        if: failure()
        run: |
          echo "❌ CALIBRATION COVERAGE GATE FAILED"
          echo ""
          echo "SIN_CARRETA Requirement 2: Minimum 25% calibration coverage not met."
          echo ""
          echo "Actions required:"
          echo "  1. Review uncalibrated methods in validator output above"
          echo "  2. Add entries to config/intrinsic_calibration.json using scripts/rigorous_calibration_triage.py"
          echo "  3. Focus on critical intrinsic profiles first"
          echo "  4. Ensure calibrations follow the Three-Pillar system guidelines"
          echo ""
          echo "See SIN_CARRETA_COMPLIANCE.md for calibration guidelines"
          exit 1
